version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /src/ide/vscode
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        update-types: [minor, patch]
