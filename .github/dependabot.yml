version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget:
        update-types: [minor, patch]
    # Analyzers and code fixes must keep targeting Roslyn 4.8 (see docs/ROADMAP.md); the CLI is bumped by hand.
    ignore:
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      - dependency-name: Microsoft.CodeAnalysis.CSharp.Workspaces
  - package-ecosystem: npm
    directory: /src/ide/vscode
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Types must match engines.vscode and the Node version of CI.
      - dependency-name: "@types/vscode"
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        update-types: [minor, patch]
