id: NLD0001
title: Unused member
language: csharp
type: cli
category: DeadCode
defaultSeverity: warning
description: >-
  A type or member, of any accessibility, that nothing in the solution references. Reported by
  "neolinter analyze dead-code". Members used through reflection, dependency injection,
  serialization or naming conventions can be excluded in neolinter.json.
options: []
